version: 2
updates:
  # npm / Node.js
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    groups:
      production-deps:
        dependency-type: "production"
      dev-deps:
        dependency-type: "development"

  # pip / Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]

  # Cargo / Rust
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "security"]
    ignore:
      # groth16-solana 0.2 requires solana-bn254 ^2; a 3.x direct dependency
      # only adds a second copy (with solana-define-syscall 5.x) next to it.
      - dependency-name: "solana-bn254"
        versions: [">= 3"]
      # anchor-lang 0.30.1 and solana-program 1.18 stay on base64 0.21; move
      # together with the Anchor upgrade instead of on its own.
      - dependency-name: "base64"
        versions: [">= 0.22"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
