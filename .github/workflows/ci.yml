name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  public-node:
    name: Public Repo + SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install

      - name: Run public checks and SDK tests
        run: npm test

  python-syntax:
    name: Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python client files
        run: python3 -m py_compile client/*.py

  rust:
    name: Rust Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Rust tests
        run: cargo test
