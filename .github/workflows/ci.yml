name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  public-node:
    name: Public Repo + Proofs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Run public checks and SDK tests
        run: npm test

      - name: Run proof hardening tests
        run: npm run test:proof

      - name: Verify release artifact integrity
        run: npm run release:verify

  security:
    name: NPM Audit Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Block high and critical npm advisories
        run: npm run test:security

  python-syntax:
    name: Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile Python client files
        run: npm run test:python

  rust:
    name: Rust Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Rust tests
        run: cargo test --locked
