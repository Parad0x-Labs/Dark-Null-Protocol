    <text x="92" y="198" fill="white" font-size="28" font-weight="800">note enters set</text>

    <rect x="286" y="124" width="190" height="120" rx="18" fill="#170D25" stroke="#4B3561"/>
    <text x="320" y="164" fill="#BFDFFF" font-size="18" font-weight="700">COMMIT</text>
    <text x="320" y="198" fill="white" font-size="28" font-weight="800">32B claim hash</text>

    <rect x="530" y="100" width="210" height="168" rx="18" fill="#1C102E" stroke="#72C7FF"/>
