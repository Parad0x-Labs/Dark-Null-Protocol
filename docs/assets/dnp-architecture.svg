<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="360" rx="24" fill="#0F0818"/>
  <text x="52" y="54" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">How Dark Null Fits Together</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="124" width="176" height="120" rx="18" fill="#170D25" stroke="#4B3561"/>
