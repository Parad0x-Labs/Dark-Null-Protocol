[package]
name = "dark-null-spike-p0"
version = "0.0.1"
edition = "2021"
rust-version = "1.86"
license = "MIT"
publish = false
description = "Phase 0 spike program: sol_poseidon vectors, nullifier stores, Groth16 and PLONK verify cost"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["store", "verify", "fflonk"]
# build-time split: two small programs keep devnet rent low
store = []
verify = []
fflonk = []

[dependencies]
pinocchio = "=0.9.3"
pinocchio-system = "=0.4.0"
groth16-solana = "=0.2.0"

[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-bn254 = "=2.2.2"
sha3 = "0.10"

[dev-dependencies]
num-bigint = "0.4"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = false
panic = "abort"

[workspace]
