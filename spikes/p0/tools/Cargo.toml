[package]
name = "dark-null-p0-tools"
version = "0.0.1"
edition = "2021"
rust-version = "1.86"
license = "MIT"
publish = false
description = "Phase 0 host tools: light-poseidon vectors and pure-Rust Groth16 prover benchmark"

[dependencies]
light-poseidon = "=0.4.0"
ark-bn254 = "0.5"
ark-ff = "0.5"
ark-ec = "0.5"
ark-std = "0.5"
ark-serialize = "0.5"
ark-relations = "0.5"
ark-groth16 = { version = "0.5", features = ["parallel"] }
ark-snark = "0.5"
num-bigint = "0.4"
serde_json = "1"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"

[workspace]
